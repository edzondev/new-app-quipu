name: Setup
description: Node, pnpm and dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: pnpm/action-setup@v6.1.1
      with:
        run_install: false
        cache: true
        cache_dependency_path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
