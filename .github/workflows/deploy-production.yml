name: Deploy production

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: quipu-deploy-production
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm --filter web run generate-routes
      - run: pnpm run typecheck
      - run: pnpm --filter @quipu/backend test

  deploy-production:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check config and select production
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CONVEX_DEPLOY_KEY"
          test -n "$VITE_CONVEX_SITE_URL"
          echo "CLOUDFLARE_ENV=production" > apps/web/.env.production
      - name: Deploy Convex and build web
        working-directory: packages/backend
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: >-
          pnpm exec convex deploy
          --cmd "pnpm --dir ../../apps/web run build:production"
          --cmd-url-env-var-name VITE_CONVEX_URL
      - name: Deploy worker
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env production
