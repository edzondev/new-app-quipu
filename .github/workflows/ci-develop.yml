name: CI develop

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm --filter web run generate-routes
      - run: pnpm run typecheck
      - run: pnpm --filter @quipu/backend test

  deploy-develop:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: develop
    concurrency:
      group: quipu-deploy-develop
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check config and select develop
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CONVEX_DEPLOY_KEY"
          test -n "$VITE_CONVEX_SITE_URL"
          echo "CLOUDFLARE_ENV=develop" > apps/web/.env.develop
      - name: Deploy Convex and build web
        working-directory: packages/backend
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: >-
          pnpm exec convex deploy
          --cmd "pnpm --dir ../../apps/web run build:develop"
          --cmd-url-env-var-name VITE_CONVEX_URL
      - name: Deploy worker
        working-directory: apps/web
        run: pnpm exec wrangler deploy
