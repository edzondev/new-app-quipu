  - "@expo/inline-modules@0.2.10"
  - "@expo/local-build-cache-provider@58.0.12"
  - "@expo/metro-config@58.0.22"
  - "@expo/metro-file-map@58.0.6"
  - "@expo/plist@0.10.2"
