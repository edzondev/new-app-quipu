packages:
  - "apps/*"
  - "packages/*"
trustLockfile: true
verifyDepsBeforeRun: false
minimumReleaseAge: 4320
allowBuilds:
  esbuild: true
  lefthook: true
  lightningcss: true
  sharp: true
  workerd: true
overrides:
  better-auth: 1.7.18
  "@better-auth/core": 1.7.18
  "@better-auth/passkey": 1.7.18
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-start":
    skills: true
minimumReleaseAgeExclude:
